<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<canvas id="out"></canvas>
<script type="module">
// Viñeta de "La Incursión": figuras de la Biblioteca en cel shading con contorno
// de tinta, sin base, sobre fondos dibujados en canvas 2D. Config en el hash (JSON).
import * as THREE from 'three'
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js'
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js'

const P = JSON.parse(decodeURIComponent(location.hash.slice(1)))
const W = P.w || 3840, H = P.h || 2160, K = H / 2160
const TINTA = '#121019'
const out = document.getElementById('out'); out.width = W; out.height = H
const g = out.getContext('2d')
function rnd(seed){ let s = seed>>>0; return () => (s = (s*1664525+1013904223)>>>0)/4294967296 }
const R = rnd(P.seed || 7)

// ================= fondos =================
function cielo(top, bot){ const gr=g.createLinearGradient(0,0,0,H); gr.addColorStop(0,top); gr.addColorStop(1,bot); g.fillStyle=gr; g.fillRect(0,0,W,H) }
function brillo(x,y,r,stops){ const gr=g.createRadialGradient(x,y,0,x,y,r); stops.forEach(([o,c])=>gr.addColorStop(o,c)); g.fillStyle=gr; g.beginPath(); g.arc(x,y,r,0,7); g.fill() }
function estrellas(n){ g.save(); g.fillStyle='#fff'; for(let i=0;i<n;i++){ g.globalAlpha=0.3+R()*0.7; const s=(2+R()*5)*K; g.fillRect(R()*W, R()*H*0.75, s, s)} g.restore() }
function lineasVelocidad(cx, cy, n, r0, color, alpha){
  g.save(); g.globalAlpha=alpha; g.fillStyle=color
  for(let i=0;i<n;i++){ const a=R()*Math.PI*2, w=0.002+R()*0.008, r1=Math.hypot(W,H)*1.2, r=r0*(0.85+R()*0.5)
    g.beginPath(); g.moveTo(cx+Math.cos(a)*r, cy+Math.sin(a)*r); g.lineTo(cx+Math.cos(a-w)*r1, cy+Math.sin(a-w)*r1); g.lineTo(cx+Math.cos(a+w)*r1, cy+Math.sin(a+w)*r1); g.fill() }
  g.restore()
}
function trama(y0,color,paso,maxR){ g.save(); g.fillStyle=color; paso*=K; maxR*=K
  for(let y=y0;y<H;y+=paso) for(let x=0;x<W;x+=paso){ const r=maxR*(y-y0)/(H-y0); if(r<0.4) continue; g.beginPath(); g.arc(x+((Math.round(y/paso))%2?paso/2:0),y,r,0,7); g.fill() }
  g.restore() }
function trazo(){ g.strokeStyle=TINTA; g.lineWidth=10*K; g.lineJoin='round'; g.stroke() }
function rocas(color,base){ g.save(); g.fillStyle=color; g.beginPath(); g.moveTo(-20,H)
  for(let x=-20;x<=W+W/40;x+=W/40) g.lineTo(x, base - R()*H*0.1 - (R()<.15? H*0.17:0))
  g.lineTo(W+20,H); g.closePath(); g.fill(); trazo(); g.restore() }
function colinas(color,base){ g.save(); g.fillStyle=color; g.beginPath(); g.moveTo(-20,H); let y=base
  for(let x=-20;x<=W+60;x+=60*K){ y = base - H*0.06*Math.sin(x/W*6+1) - H*0.03*Math.sin(x/W*17); g.lineTo(x,y) }
  g.lineTo(W+20,H); g.closePath(); g.fill(); trazo()
  // castillo lejano
  if(false){ const cx=W*(0.15+R()*0.7), b=base-H*0.12; g.fillStyle=TINTA+'cc'
    for(let i=-2;i<=2;i++){ const tw=W*0.018, th=H*(0.08+0.05*(2-Math.abs(i))); g.fillRect(cx+i*tw*1.4,b-th,tw,th); g.beginPath(); g.moveTo(cx+i*tw*1.4-tw*0.2,b-th); g.lineTo(cx+i*tw*1.4+tw/2,b-th-H*0.05); g.lineTo(cx+i*tw*1.4+tw*1.2,b-th); g.fill() } }
  g.restore() }
function ciudad(color,base){ g.save()
  for(const [capa,alt,c] of [[0,0.42,color+'88'],[1,0.3,color]]){ let x=-20
    while(x<W){ const bw=W*(0.025+R()*0.05), bh=H*(0.08+R()*alt); g.fillStyle=c; g.fillRect(x,base-bh,bw,bh+H)
      g.strokeStyle=TINTA; g.lineWidth=6*K; g.strokeRect(x,base-bh,bw,bh+H)
      if(capa){ g.fillStyle='#ffe9a8'; for(let wy=base-bh+H*0.02; wy<base-H*0.02; wy+=H*0.03) for(let wx=x+bw*0.15; wx<x+bw*0.85; wx+=bw*0.22) if(R()<0.45) g.fillRect(wx,wy,bw*0.1,H*0.012) }
      x+=bw+W*0.004 } }
  g.fillStyle=TINTA; g.fillRect(0,base,W,H); g.restore() }
function estantes(color,base){ // el Archivo: estantes infinitos en perspectiva
  g.save(); const fx=W/2, fy=H*0.42
  for(let i=0;i<14;i++){ const t=i/14; const y=fy+(H-fy)*Math.pow(t,1.6)*1.3
    g.strokeStyle=color; g.globalAlpha=0.25+0.6*t; g.lineWidth=(3+14*t)*K
    g.beginPath(); g.moveTo(-W*0.1,y-(y-fy)*0.2); g.lineTo(fx-W*0.05*(1-t),fy+ (y-fy)*0.02); g.stroke()
    g.beginPath(); g.moveTo(W*1.1,y-(y-fy)*0.2); g.lineTo(fx+W*0.05*(1-t),fy+(y-fy)*0.02); g.stroke() }
  g.globalAlpha=1
  // siluetas de figuras en los estantes
  for(let i=0;i<220;i++){ const lado=R()<.5?-1:1, t=R(); const d=Math.pow(t,1.5); const x=fx+lado*(W*0.06+W*0.55*d), y=fy+(H*0.55)*d*0.9-H*0.25*d; const s=(8+70*d)*K
    g.fillStyle=`hsl(${R()*360},70%,${50+R()*20}%)`; g.globalAlpha=0.35+0.6*d
    g.beginPath(); g.arc(x,y-s*1.1,s*0.55,0,7); g.fill(); g.fillRect(x-s*0.35,y-s*0.6,s*0.7,s*0.9) }
  g.restore() }
function galaxia(cx,cy,r,c1,c2){ g.save(); g.globalCompositeOperation='lighter'
  for(let i=0;i<900;i++){ const a=R()*Math.PI*2*3, d=Math.pow(R(),0.6)*r; const ang=a+d/r*5
    g.fillStyle = R()<.5? c1 : c2; g.globalAlpha=0.08+R()*0.25; const s=(3+R()*10)*K
    g.beginPath(); g.arc(cx+Math.cos(ang)*d, cy+Math.sin(ang)*d*0.45, s,0,7); g.fill() }
  brillo(cx,cy,r*0.35,[[0,'#ffffffcc'],[0.4,c1+'66'],[1,c1+'00']]); g.restore() }
function cometa(x,y,ang,len,c){ g.save(); g.globalCompositeOperation='lighter'; const dx=Math.cos(ang)*len, dy=Math.sin(ang)*len
  for(const [w,a] of [[60,0.12],[30,0.3],[12,0.8]]){ const gr=g.createLinearGradient(x,y,x-dx,y-dy); gr.addColorStop(0,c); gr.addColorStop(1,c+'00'); g.strokeStyle=gr; g.globalAlpha=a; g.lineWidth=w*K; g.lineCap='round'; g.beginPath(); g.moveTo(x,y); g.lineTo(x-dx,y-dy); g.stroke() }
  brillo(x,y,40*K,[[0,'#ffffff'],[1,c+'00']]); g.restore() }
function dimension(c){ // la Otra Dimensión: espirales y fragmentos
  g.save(); g.globalCompositeOperation='lighter'
  for(let i=0;i<40;i++){ g.strokeStyle=c; g.globalAlpha=0.08+R()*0.15; g.lineWidth=(4+R()*20)*K; g.beginPath(); const r=W*(0.05+i*0.02); g.arc(W/2,H*0.45,r,R()*7,R()*7+2); g.stroke() }
  g.restore() }

function mundo(m){
  cielo(...m.cielo)
  if(m.estrellas) estrellas(m.estrellas===true?450:m.estrellas)
  if(m.galaxia) galaxia(W*m.galaxia[0],H*m.galaxia[1],W*0.45,m.galaxia[2]||'#b46bff',m.galaxia[3]||'#4aa8ff')
  if(m.dimension) dimension(m.dimension)
  if(m.sol) brillo(W*m.sol[0],H*m.sol[1],H*m.sol[2],[[0,'#ffffff'],[0.25,m.sol[3]],[1,m.sol[3]+'00']])
  if(m.cometa) cometa(W*m.cometa[0],H*m.cometa[1],m.cometa[2],W*0.5,m.cometa[3]||'#9fe8ff')
  if(m.lineas) lineasVelocidad(W*(m.lineasX??0.5),H*0.5,160,W*0.16,m.lineas,0.16)
  const base = H*(m.horizonte ?? 0.8)
  const s = m.suelo
  if(s==='rocas') rocas(m.colorSuelo,base); else if(s==='colinas') colinas(m.colorSuelo,base)
  else if(s==='ciudad') ciudad(m.colorSuelo,base); else if(s==='estantes') estantes(m.colorSuelo,base)
  else if(s==='plano'){ g.fillStyle=m.colorSuelo; g.fillRect(0,base,W,H); g.beginPath(); g.moveTo(0,base); g.lineTo(W,base); trazo() }
  if(s) trama(base-H*0.05,'#00000050',22,9)
}
function grietaPts(cx){ const pts=[]; for(let y=-20;y<=H+20;y+=H/14) pts.push([cx+(R()-.5)*W*0.07,y]); return pts }
function trazar(pts){ g.beginPath(); pts.forEach(([x,y],i)=> i? g.lineTo(x,y) : g.moveTo(x,y)) }
function fondo(F){
  const mundos = F.mundos, cortes = (F.grietas||[]).map(x=>grietaPts(x*W))
  mundos.forEach((m,i)=>{ g.save(); g.beginPath()
    const izq = i===0? null : cortes[i-1], der = i===mundos.length-1? null : cortes[i]
    if(izq){ izq.forEach(([x,y],k)=> k? g.lineTo(x,y) : g.moveTo(x,y)) } else { g.moveTo(-50,-20); g.lineTo(-50,H+20) }
    if(der){ [...der].reverse().forEach(([x,y])=>g.lineTo(x,y)) } else { g.lineTo(W+50,H+20); g.lineTo(W+50,-20) }
    g.closePath(); g.clip(); mundo(m); g.restore() })
  for(const pts of cortes){ g.save(); g.globalCompositeOperation='lighter'
    for(const [w,c] of [[150,'#7a2cff22'],[70,'#b46bff66'],[28,'#e9d4ffcc'],[9,'#ffffff']]){ g.strokeStyle=c; g.lineWidth=w*K; g.lineJoin='miter'; trazar(pts); g.stroke() }
    g.restore()
    g.save(); for(let i=0;i<40;i++){ const [px,py]=pts[Math.floor(R()*pts.length)]; const x=px+(R()-.5)*W*0.12, y=py+(R()-.5)*H*0.1, s=(10+R()*44)*K
      g.fillStyle=mundos[Math.floor(R()*mundos.length)].cielo[0]; g.strokeStyle='#e9d4ff'; g.lineWidth=4*K
      g.beginPath(); g.moveTo(x,y); g.lineTo(x+s,y+s*.3); g.lineTo(x+s*.4,y+s); g.closePath(); g.fill(); g.stroke() } g.restore() }
}

// ================= 3D =================
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true, preserveDrawingBuffer:true })
renderer.setPixelRatio(1); renderer.setSize(W,H,false); renderer.outputColorSpace = THREE.SRGBColorSpace
renderer.localClippingEnabled = true
const scene = new THREE.Scene()
const cam = new THREE.PerspectiveCamera(P.fov||30, W/H, 0.05, 200)
cam.position.set(...(P.cam||[0,1,6])); cam.lookAt(...(P.mira||[0,0.9,0]))
const grad = new THREE.DataTexture(new Uint8Array([95,95,95,255, 180,180,180,255, 255,255,255,255]),3,1)
grad.minFilter = grad.magFilter = THREE.NearestFilter; grad.needsUpdate = true
const sol = new THREE.DirectionalLight('#ffffff', P.luzI ?? 2.6); sol.position.set(...(P.luz||[2,4,5])); scene.add(sol)
scene.add(new THREE.AmbientLight(P.ambiente||'#ffffff', P.ambienteI ?? 1.25))
for(const [c,pos,i] of (P.rim||[])){ const l=new THREE.DirectionalLight(c,i); l.position.set(...pos); scene.add(l) }

const tinta = (grosor, planos) => new THREE.ShaderMaterial({
  uniforms:{ uG:{value:grosor} }, side:THREE.BackSide, clipping:true, clippingPlanes:planos,
  vertexShader:`uniform float uG;
    #include <clipping_planes_pars_vertex>
    void main(){ vec4 mvPosition = modelViewMatrix*vec4(position,1.0); vec3 n = normalize(normalMatrix*normal); mvPosition.xyz += n*uG;
    #include <clipping_planes_vertex>
    gl_Position = projectionMatrix*mvPosition; }`,
  fragmentShader:`
    #include <clipping_planes_pars_fragment>
    void main(){
    #include <clipping_planes_fragment>
    gl_FragColor = vec4(0.071,0.063,0.098,1.0); }`
})

const loader = new GLTFLoader(); loader.setMeshoptDecoder(MeshoptDecoder)
const draco = new DRACOLoader(); draco.setDecoderPath('/draco/'); loader.setDRACOLoader(draco)

/** Altura (en unidades del modelo) donde termina la peana, o null si no tiene. */
function detectarBase(root){
  root.updateMatrixWorld(true)
  const pts=[]; const v=new THREE.Vector3()
  root.traverse(o=>{ if(!o.isMesh) return; const p=o.geometry.attributes.position; const paso=Math.max(1,Math.floor(p.count/60000))
    for(let i=0;i<p.count;i+=paso){ v.fromBufferAttribute(p,i).applyMatrix4(o.matrixWorld); pts.push(v.x,v.y,v.z) } })
  const box=new THREE.Box3().setFromObject(root); const c=box.getCenter(new THREE.Vector3()); const h=box.max.y-box.min.y
  const N=100, ext=new Float32Array(N), sect=Array.from({length:N},()=>new Set()), maxR=new Float32Array(N)
  for(let i=0;i<pts.length;i+=3){ const b=Math.min(N-1,Math.floor((pts[i+1]-box.min.y)/h*N)); const dx=pts[i]-c.x, dz=pts[i+2]-c.z; const r=Math.hypot(dx,dz); if(r>maxR[b]) maxR[b]=r }
  for(let i=0;i<pts.length;i+=3){ const b=Math.min(N-1,Math.floor((pts[i+1]-box.min.y)/h*N)); const dx=pts[i]-c.x, dz=pts[i+2]-c.z; if(Math.hypot(dx,dz)>0.75*maxR[b]) sect[b].add(Math.floor((Math.atan2(dz,dx)+Math.PI)/(2*Math.PI)*16)%16) }
  if(P.debug) console.log('PERFIL', Array.from(maxR.slice(0,20)).map((r,i)=>(r/maxR[0]).toFixed(2)+'/'+sect[i].size).join(' '))
  // la peana: franjas de abajo, anchas y que dan la vuelta completa
  if(sect[0].size<13 && sect[1].size<13) return null
  const E0=Math.max(maxR[0],maxR[1],maxR[2])
  for(let b=1;b<25;b++){
    if(maxR[b]<0.75*E0 && maxR[b+1]<0.75*E0 && maxR[b+2]<0.75*E0 && sect[b].size<13) return box.min.y + (b+0.6)/N*h
  }
  return null
}

async function figura(f){
  const gl = await loader.loadAsync(f.glb)
  const root = gl.scene
  const box = new THREE.Box3().setFromObject(root)
  let corte = f.corte===false? null : (typeof f.corte==='number'? box.min.y + f.corte*(box.max.y-box.min.y) : detectarBase(root))
  const piso = corte ?? box.min.y
  const s = (f.alto||1.8)/(box.max.y-piso)
  const c = box.getCenter(new THREE.Vector3())
  const grupo = new THREE.Group(); grupo.add(root)
  root.scale.setScalar(s); root.position.set(-c.x*s, -piso*s, -c.z*s)
  grupo.position.set(...(f.pos||[0,0,0])); grupo.rotation.y=(f.giro||0)*Math.PI/180; grupo.rotation.z=(f.inclina||0)*Math.PI/180
  if(f.espejo) grupo.scale.x=-1
  scene.add(grupo); grupo.updateMatrixWorld(true)
  const planos = corte!==null ? [new THREE.Plane(new THREE.Vector3(0,1,0), -(f.pos?.[1]||0) + 0.0005)] : []
  const mallas=[]; root.traverse(o=>{ if(o.isMesh) mallas.push(o) })
  for(const m of mallas){
    const old = m.material
    m.material = new THREE.MeshToonMaterial({ map: f.blanco? null : (old.map||null), color: f.blanco? '#f2efe8' : (old.map? '#ffffff' : (f.color || old.color || '#ccc')), gradientMap: grad,
      emissive: f.emisivo||'#000000', emissiveIntensity: f.emisivoI||0, clippingPlanes: planos, side: planos.length? THREE.DoubleSide : THREE.FrontSide })
    if(f.tono) m.material.color.set(f.tono)
    if(!m.geometry.attributes.normal) m.geometry.computeVertexNormals()
    m.add(new THREE.Mesh(m.geometry, tinta((f.tinta||0.011)/s, planos)))
  }
  return { f, corte: corte!==null }
}

// ================= efectos =================
const proy = p => { const v=new THREE.Vector3(...p).project(cam); return [(v.x+1)/2*W,(1-v.y)/2*H] }
function rayo(x0,y0,x1,y1,grosor,nucleo,halo){ g.save(); g.globalCompositeOperation='lighter'; g.lineCap='round'
  for(const [w,c] of [[grosor*3,halo+'33'],[grosor*1.8,halo+'88'],[grosor,halo],[grosor*0.45,nucleo]]){ g.strokeStyle=c; g.lineWidth=w; g.beginPath(); g.moveTo(x0,y0); g.lineTo(x1,y1); g.stroke() }
  g.restore() }
function relampago(x0,y0,x1,y1,c){ g.save(); g.globalCompositeOperation='lighter'; for(const [w,a] of [[26,0.25],[10,0.7],[4,1]]){ g.strokeStyle=a===1?'#ffffff':c; g.globalAlpha=a; g.lineWidth=w*K; g.beginPath(); g.moveTo(x0,y0); const n=9; for(let i=1;i<=n;i++){ const t=i/n; g.lineTo(x0+(x1-x0)*t+(i<n?(R()-.5)*H*0.08:0), y0+(y1-y0)*t+(i<n?(R()-.5)*H*0.08:0)) } g.stroke() } g.restore() }
function efecto(b){
  const [x0,y0]=proy(b.de), [x1,y1]=proy(b.a||b.de)
  const gr=(b.grosor||60)*K
  if(b.tipo==='meteoros'){ for(let i=0;i<26;i++){ const ox=(R()-.5)*H*0.16, oy=(R()-.5)*H*0.22, t=0.3+R()*0.7
      rayo(x0+(x1-x0)*(1-t)+ox*0.3,y0+(y1-y0)*(1-t)+oy*0.3, x1+ox*0.2, y1+oy*0.2, (10+R()*14)*K, '#ffffff', b.color) }
    for(let i=0;i<26;i++){ const t=R(); g.save(); g.globalCompositeOperation='lighter'; brillo(x0+(x1-x0)*t+(R()-.5)*H*.2, y0+(y1-y0)*t+(R()-.5)*H*.25,(24+R()*30)*K,[[0,'#ffffff'],[0.3,b.color+'cc'],[1,b.color+'00']]); g.restore() } }
  else if(b.tipo==='rafaga'){ for(let i=0;i<(b.n||9);i++){ const t=R(); const x=x0+(x1-x0)*t+(R()-.5)*H*0.12, y=y0+(y1-y0)*t+(R()-.5)*H*0.12
      rayo(x-(x1-x0)*0.06,y-(y1-y0)*0.06,x,y,gr*0.4,'#ffffff',b.color); g.save(); g.globalCompositeOperation='lighter'; brillo(x,y,gr*0.9,[[0,'#ffffff'],[0.3,b.color+'dd'],[1,b.color+'00']]); g.restore() } }
  else if(b.tipo==='relampago') relampago(x0,y0,x1,y1,b.color)
  else if(b.tipo==='esfera'){ g.save(); g.globalCompositeOperation='lighter'; brillo(x0,y0,gr,[[0,'#ffffff'],[0.35,b.color+'ff'],[0.7,b.color+'66'],[1,b.color+'00']]); g.restore() }
  else if(b.tipo==='hilo'){ g.save(); g.strokeStyle=b.color||'#ff2a3d'; g.lineCap='round'; g.shadowColor=b.color||'#ff2a3d'; g.shadowBlur=30*K; g.lineWidth=gr*0.12
      g.beginPath(); g.moveTo(x0,y0); const mx=(x0+x1)/2, my=Math.min(y0,y1)-H*(b.curva??0.12); g.quadraticCurveTo(mx,my,x1,y1); g.stroke(); g.restore() }
  else rayo(x0,y0,x1,y1,gr,'#ffffff',b.color)
}
function onomatopeya(o){ g.save(); g.translate(o.x*W,o.y*H); g.rotate(o.r||0); const size=o.s*H
  g.font=`${size}px "Bangers", "Arial Black", sans-serif`; g.textAlign='center'; g.lineJoin='round'
  g.lineWidth=size*0.22; g.strokeStyle=TINTA; g.strokeText(o.t,0,0); g.lineWidth=size*0.10; g.strokeStyle=o.stroke||'#ff2a3d'; g.strokeText(o.t,0,0)
  g.fillStyle=o.fill||'#fff'; g.fillText(o.t,0,0); g.restore() }

try {
  await document.fonts.load(`100px "Bangers"`)
  const info = await Promise.all((P.figuras||[]).map(figura))
  fondo(P.fondo)
  if(P.lineas) lineasVelocidad(W*P.lineas[0],H*P.lineas[1],140,W*0.12,P.lineas[2]||'#ffffff',P.lineas[3]??0.3)
  renderer.setClearColor(0x000000,0); renderer.render(scene,cam)
  for(const f of (P.figuras||[])){ if(f.sinSombra||(f.pos?.[1]||0)>0.05) continue; const [x,y]=proy([f.pos[0],0,f.pos[2]])
    g.save(); g.fillStyle='#00000077'; g.beginPath(); g.ellipse(x,y,W*0.05*(f.alto||1.8)/1.8,H*0.014,0,0,7); g.fill(); g.restore() }
  for(const a of (P.auras||[])){ const [x,y]=proy(a.pos); g.save(); g.globalCompositeOperation='lighter'; brillo(x,y,a.r*W,[[0,a.c+'aa'],[0.5,a.c+'44'],[1,a.c+'00']]); g.restore() }
  for(const b of (P.detras||[])) efecto(b)
  g.drawImage(renderer.domElement,0,0)
  for(const b of (P.efectos||[])) efecto(b)
