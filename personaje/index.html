<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0B" />

    <!-- El título es lo que se ve en la pestaña, en Google y al compartir el
         enlace. Para una pieza de portfolio tiene que decir qué es y de quién,
         no solo cómo se llama. Cambia el nombre aquí y en src/lib/autor.ts. -->
    <title>Historias Dragon Ball · Biblioteca 3D</title>
    <meta
      name="description"
      content="Cada figura de Dragon Ball de la Biblioteca 3D, contada en una sola toma de cámara gobernada por el scroll: historia, estilo de pelea, la batalla que lo definió y sus técnicas especiales."
    />
    <meta property="og:title" content="Historias Dragon Ball · Biblioteca 3D" />
    <meta
      property="og:description"
      content="La figura en 3D, su historia, su pelea y sus técnicas especiales. Biblioteca 3D."
    />
    <meta property="og:type" content="website" />

    <meta property="og:site_name" content="Lenin Bonilla · fleremahiasflemin" />

    <!--
      Autoría. LinkedIn clasifica este enlace como artículo y busca una firma;
      sin ella la tarjeta sale sin autor, que en una pieza de portfolio es
      justo lo que no puede faltar.

      `article:author` apuntando al perfil hace que la firma quede enlazada a
      él en vez de ser texto suelto.

      No se pone fecha de publicación a propósito: una pieza de portfolio con
      fecha visible envejece a ojos de quien la abre dentro de un año, y aquí
      lo que se enseña es el oficio, no la novedad.
    -->
    <meta name="author" content="Lenin Bonilla" />
    <meta property="article:author" content="https://www.linkedin.com/in/fleremahiaslenin" />
    <meta property="og:locale" content="es_ES" />

    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="/historias/favicon.svg" type="image/svg+xml" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      La japonesa se pide con `text=`: Google Fonts devuelve un subconjunto solo
      con esos glifos. Una Noto Sans JP completa son ~4 MB; así son unos cientos
      de bytes.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+JP:wght@900&display=swap&text=%E3%82%A3%E3%82%A4%E3%82%A5%E3%82%AB%E3%82%AD%E3%82%AF%E3%82%B3%E3%82%B4%E3%82%B5%E3%82%B7%E3%82%B8%E3%82%B9%E3%82%BA%E3%82%BF%E3%83%81%E3%83%83%E3%83%88%E3%83%89%E3%83%8F%E3%83%94%E3%83%96%E3%83%99%E3%83%9C%E3%83%A3%E3%83%A4%E3%83%A5%E3%83%A9%E3%83%AA%E3%83%AB%E3%83%AD%E3%83%B3%E3%83%BC%E4%BA%80%E4%BA%BA%E5%90%88%E5%9B%9B%E5%A4%A9%E5%AD%AB%E6%82%9F%E6%A5%BD%E6%AD%A6%E6%AE%BA%E7%89%9B%E7%A5%9E%E7%A9%BA%E8%9E%8D%E8%B6%85%E9%A3%AF%E9%AD%94%E9%B6%B4%E9%BE%8D"
      rel="stylesheet"
    />
  </head>
